name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # head_ref is empty on push, so fall back to the pushed ref (refs/heads/main).
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, Type Check & Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      # Fails on a bundled library outside ALLOWED_LICENSES in the script,
      # or when THIRD-PARTY-LICENSES.md wasn't regenerated after a dependency change.
      - name: License check
        run: |
          npm run licenses
          git diff --exit-code THIRD-PARTY-LICENSES.md

      - name: Type check
        run: |
          npx --no-install vue-tsgo --project tsconfig.app.json
          npx --no-install tsc --project tsconfig.node.json

      - name: Lint
        run: npx --no-install oxlint src

      - name: Unit tests
        run: npx --no-install vitest run

  validate-build:
    name: Build & Validate
    runs-on: ubuntu-latest
    needs: checks

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        run: npx --no-install vite build

      - name: Install Playwright Chromium
        run: npx --no-install playwright install --with-deps chromium

      - name: Validate build
        run: node scripts/validate-build.js
